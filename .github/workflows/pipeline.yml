# pipeline.yml update
name: CI Pipeline with Self-Healing

on:
  push:
    branches-ignore:
      - 'ai-self-healing-fix' # 🛑 CIRCUIT BREAKER 1: Don't run on the AI's fix branch directly
  pull_request:

jobs:
  test-and-heal:
    # 🛑 CIRCUIT BREAKER 2: Skip execution if the last commit message contains the AI signature
    if: "!contains(github.event.head_commit.message, 'autonomous patch generated by AI Healer')"
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pytest openai
          
      - name: Run Main Test Suite
        id: run_tests
        run: pytest
        continue-on-error: true 

      - name: Trigger Self-Healing AI Agent
        if: steps.run_tests.outcome == 'failure'
        run: python pl_healer.py
